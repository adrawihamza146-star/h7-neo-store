<!DOCTYPE html>  <html lang="ar" dir="rtl">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>H7 NEO | Luxe & Élégance</title>  <meta
name="description"
content="H7 NEO — اكتشف تشكيلتنا المختارة من الأزياء المحجبة، الأحذية والإكسسوارات. التوصيل داخل المغرب والدفع عند الاستلام."
> 

  <meta name="theme-color" content="#080808">    <link rel="preconnect" href="https://fonts.googleapis.com">  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    <link  
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"  
    rel="stylesheet"  
  >    <script  
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"  
    defer  
  ></script>    <script  
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"  
    defer  
  ></script>    <style>  
    :root{  
      --bg:#070707;  
      --bg2:#0d0d0d;  
      --card:#111111;  
      --card2:#151515;  
      --white:#ffffff;  
      --text:#f8f5ef;  
      --muted:#9c9c9c;  
      --gold:#c8a96b;  
      --gold2:#e5c98e;  
      --gold-dark:#8f7139;  
      --line:rgba(255,255,255,.09);  
      --line2:rgba(200,169,107,.25);  
      --green:#25d366;  
      --danger:#ff4d4d;  
      --radius:22px;  
      --radius-sm:14px;  
      --shadow:0 25px 80px rgba(0,0,0,.55);  
      --header:78px;  
      --max:1380px;  
    }  
  
    *{  
      margin:0;  
      padding:0;  
      box-sizing:border-box;  
    }  
  
    html{  
      scroll-behavior:smooth;  
      background:var(--bg);  
    }  
  
    body{  
      font-family:"Cairo",sans-serif;  
      background:  
        radial-gradient(circle at 50% -10%,rgba(200,169,107,.10),transparent 35%),  
        var(--bg);  
      color:var(--text);  
      min-height:100vh;  
      overflow-x:hidden;  
    }  
  
    body.no-scroll{  
      overflow:hidden;  
    }  
  
    button,  
    input,  
    select,  
    textarea{  
      font-family:inherit;  
    }  
  
    button{  
      cursor:pointer;  
    }  
  
    a{  
      color:inherit;  
      text-decoration:none;  
    }  
  
    img{  
      max-width:100%;  
      display:block;  
    }  
  
    ::selection{  
      background:var(--gold);  
      color:#000;  
    }  
  
    /* =========================  
       SCROLLBAR  
    ========================== */  
  
    ::-webkit-scrollbar{  
      width:8px;  
    }  
  
    ::-webkit-scrollbar-track{  
      background:#080808;  
    }  
  
    ::-webkit-scrollbar-thumb{  
      background:#383838;  
      border-radius:20px;  
    }  
  
    ::-webkit-scrollbar-thumb:hover{  
      background:var(--gold);  
    }  
  
    /* =========================  
       LOADER  
    ========================== */  
  
    #loader{  
      position:fixed;  
      inset:0;  
      z-index:99999;  
      background:#050505;  
      display:flex;  
      align-items:center;  
      justify-content:center;  
      transition:.5s ease;  
    }  
  
    #loader.hide{  
      opacity:0;  
      visibility:hidden;  
      pointer-events:none;  
    }  
  
    .loader-inner{  
      text-align:center;  
    }  
  
    .loader-logo{  
      font-family:"Playfair Display",serif;  
      font-size:42px;  
      letter-spacing:6px;  
      color:var(--gold2);  
      margin-bottom:18px;  
    }  
  
    .loader-line{  
      width:160px;  
      height:2px;  
      background:#222;  
      margin:auto;  
      overflow:hidden;  
      position:relative;  
    }  
  
    .loader-line::after{  
      content:"";  
      position:absolute;  
      inset:0;  
      width:50%;  
      background:var(--gold);  
      animation:loaderMove 1.1s infinite ease-in-out;  
    }  
  
    @keyframes loaderMove{  
      0%{transform:translateX(-100%)}  
      100%{transform:translateX(300%)}  
    }  
  
    /* =========================  
       ANNOUNCEMENT  
    ========================== */  
  
    .announcement{  
      min-height:34px;  
      background:#000;  
      border-bottom:1px solid rgba(255,255,255,.06);  
      display:flex;  
      align-items:center;  
      justify-content:center;  
      text-align:center;  
      padding:7px 15px;  
      font-size:12px;  
      color:#ddd;  
      letter-spacing:.3px;  
    }  
  
    .announcement strong{  
      color:var(--gold2);  
    }  
  
    /* =========================  
       HEADER  
    ========================== */  
  
    .header{  
      position:sticky;  
      top:0;  
      z-index:5000;  
      height:var(--header);  
      background:rgba(7,7,7,.88);  
      backdrop-filter:blur(18px);  
      -webkit-backdrop-filter:blur(18px);  
      border-bottom:1px solid var(--line);  
    }  
  
    .nav{  
      width:min(var(--max),calc(100% - 36px));  
      height:100%;  
      margin:auto;  
      display:flex;  
      align-items:center;  
      justify-content:space-between;  
      gap:25px;  
    }  
  
    .brand{  
      display:flex;  
      align-items:center;  
      gap:12px;  
      min-width:max-content;  
    }  
  
    .brand-mark{  
      width:42px;  
      height:42px;  
      border:1px solid var(--gold);  
      display:flex;  
      align-items:center;  
      justify-content:center;  
      border-radius:12px;  
      color:var(--gold2);  
      font-family:"Playfair Display",serif;  
      font-weight:700;  
      font-size:18px;  
    }  
  
    .brand-text{  
      display:flex;  
      flex-direction:column;  
      line-height:1;  
    }  
  
    .brand-name{  
      font-family:"Playfair Display",serif;  
      letter-spacing:2px;  
      font-size:22px;  
    }  
  
    .brand-sub{  
      color:var(--gold);  
      font-size:8px;  
      letter-spacing:3px;  
      margin-top:6px;  
    }  
  
    .nav-links{  
      display:flex;  
      align-items:center;  
      gap:28px;  
    }  
  
    .nav-links a{  
      color:#d4d4d4;  
      font-size:13px;  
      position:relative;  
      transition:.25s;  
    }  
  
    .nav-links a::after{  
      content:"";  
      position:absolute;  
      bottom:-9px;  
      right:0;  
      width:0;  
      height:1px;  
      background:var(--gold);  
      transition:.25s;  
    }  
  
    .nav-links a:hover{  
      color:var(--gold2);  
    }  
  
    .nav-links a:hover::after{  
      width:100%;  
    }  
  
    .nav-actions{  
      display:flex;  
      align-items:center;  
      gap:9px;  
    }  
  
    .icon-btn{  
      width:42px;  
      height:42px;  
      border:1px solid var(--line);  
      background:#101010;  
      color:#fff;  
      border-radius:50%;  
      display:flex;  
      align-items:center;  
      justify-content:center;  
      transition:.25s;  
      position:relative;  
      font-size:17px;  
    }  
  
    .icon-btn:hover{  
      border-color:var(--gold);  
      color:var(--gold2);  
      transform:translateY(-2px);  
    }  
  
    .badge{  
      position:absolute;  
      top:-3px;  
      left:-2px;  
      min-width:18px;  
      height:18px;  
      border-radius:50%;  
      background:var(--gold);  
      color:#000;  
      font-size:10px;  
      display:flex;  
      align-items:center;  
      justify-content:center;  
      font-weight:800;  
      padding:0 4px;  
    }  
  
    .menu-btn{  
      display:none;  
    }  
  
    /* =========================  
       MOBILE MENU  
    ========================== */  
  
    .mobile-menu{  
      position:fixed;  
      top:0;  
      right:0;  
      width:min(360px,88vw);  
      height:100dvh;  
      background:#0b0b0b;  
      z-index:9000;  
      transform:translateX(105%);  
      transition:.35s ease;  
      border-left:1px solid var(--line);  
      box-shadow:var(--shadow);  
      padding:90px 25px 30px;  
    }  
  
    .mobile-menu.open{  
      transform:translateX(0);  
    }  
  
    .mobile-close{  
      position:absolute;  
      top:22px;  
      left:22px;  
      width:40px;  
      height:40px;  
      border-radius:50%;  
      border:1px solid var(--line);  
      background:#111;  
      color:#fff;  
      font-size:20px;  
    }  
  
    .mobile-menu nav{  
      display:flex;  
      flex-direction:column;  
      gap:7px;  
    }  
  
    .mobile-menu nav a{  
      padding:15px;  
      border-bottom:1px solid var(--line);  
      color:#eee;  
    }  
  
    .mobile-menu nav a:hover{  
      color:var(--gold2);  
    }  
  
    .overlay{  
      position:fixed;  
      inset:0;  
      z-index:7000;  
      background:rgba(0,0,0,.7);  
      opacity:0;  
      visibility:hidden;  
      transition:.3s;  
      backdrop-filter:blur(4px);  
    }  
  
    .overlay.show{  
      opacity:1;  
      visibility:visible;  
    }  
  
    /* =========================  
       HERO  
    ========================== */  
  
    .hero{  
      width:min(var(--max),calc(100% - 36px));  
      min-height:650px;  
      margin:22px auto 0;  
      border:1px solid var(--line);  
      border-radius:30px;  
      overflow:hidden;  
      position:relative;  
      display:flex;  
      align-items:center;  
      background:  
        linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.66) 42%,rgba(0,0,0,.15) 100%),  
        url("بالغينة صيفية_1.jpg") center/cover no-repeat;  
    }  
  
    .hero::after{  
      content:"";  
      position:absolute;  
      inset:0;  
      background:  
        radial-gradient(circle at 75% 40%,rgba(200,169,107,.16),transparent 30%),  
        linear-gradient(to top,rgba(0,0,0,.6),transparent 50%);  
      pointer-events:none;  
    }  
  
    .hero-content{  
      position:relative;  
      z-index:2;  
      width:min(650px,100%);  
      padding:70px;  
    }  
  
    .eyebrow{  
      display:inline-flex;  
      align-items:center;  
      gap:9px;  
      color:var(--gold2);  
      font-size:12px;  
      letter-spacing:2px;  
      text-transform:uppercase;  
      margin-bottom:20px;  
    }  
  
    .eyebrow::before{  
      content:"";  
      width:32px;  
      height:1px;  
      background:var(--gold);  
    }  
  
    .hero h1{  
      font-family:"Playfair Display",serif;  
      font-size:clamp(48px,7vw,88px);  
      line-height:.95;  
      font-weight:600;  
      letter-spacing:-2px;  
      margin-bottom:25px;  
    }  
  
    .hero h1 span{  
      color:var(--gold2);  
    }  
  
    .hero p{  
      color:#d0d0d0;  
      line-height:2;  
      font-size:15px;  
      max-width:560px;  
      margin-bottom:32px;  
    }  
  
    .hero-actions{  
      display:flex;  
      gap:12px;  
      flex-wrap:wrap;  
    }  
  
    .btn{  
      min-height:48px;  
      padding:0 23px;  
      border-radius:12px;  
      border:1px solid transparent;  
      display:inline-flex;  
      align-items:center;  
      justify-content:center;  
      gap:8px;  
      font-size:13px;  
      font-weight:700;  
      transition:.25s;  
    }  
  
    .btn-gold{  
      background:var(--gold);  
      color:#050505;  
    }  
  
    .btn-gold:hover{  
      background:var(--gold2);  
      transform:translateY(-2px);  
      box-shadow:0 10px 30px rgba(200,169,107,.2);  
    }  
  
    .btn-outline{  
      border-color:rgba(255,255,255,.2);  
      background:rgba(0,0,0,.25);  
      color:#fff;  
    }  
  
    .btn-outline:hover{  
      border-color:var(--gold);  
      color:var(--gold2);  
      transform:translateY(-2px);  
    }  
  
    /* =========================  
       TRUST STRIP  
    ========================== */  
  
    .trust{  
      width:min(var(--max),calc(100% - 36px));  
      margin:16px auto 0;  
      display:grid;  
      grid-template-columns:repeat(4,1fr);  
      gap:12px;  
    }  
  
    .trust-item{  
      background:#0d0d0d;  
      border:1px solid var(--line);  
      border-radius:16px;  
      padding:18px;  
      display:flex;  
      align-items:center;  
      gap:13px;  
    }  
  
    .trust-icon{  
      width:40px;  
      height:40px;  
      border-radius:12px;  
      display:flex;  
      align-items:center;  
      justify-content:center;  
      background:rgba(200,169,107,.08);  
      color:var(--gold2);  
      flex:none;  
    }  
  
    .trust-text strong{  
      display:block;  
      font-size:12px;  
      margin-bottom:3px;  
    }  
  
    .trust-text span{  
      color:var(--muted);  
      font-size:10px;  
    }  
  
    /* =========================  
       SECTIONS  
    ========================== */  
  
    .section{  
      width:min(var(--max),calc(100% - 36px));  
      margin:100px auto 0;  
    }  
  
    .section-head{  
      display:flex;  
      align-items:end;  
      justify-content:space-between;  
      gap:20px;  
      margin-bottom:28px;  
    }  
  
    .section-kicker{  
      color:var(--gold);  
      font-size:11px;  
      letter-spacing:2px;  
      text-transform:uppercase;  
      margin-bottom:8px;  
    }  
  
    .section-title{  
      font-family:"Playfair Display",serif;  
      font-size:clamp(30px,4vw,46px);  
      font-weight:600;  
    }  
  
    .section-desc{  
      color:var(--muted);  
      max-width:470px;  
      font-size:12px;  
      line-height:1.9;  
    }  
  
    /* =========================  
       COLLECTIONS  
    ========================== */  
  
    .collections{  
      display:grid;  
      grid-template-columns:repeat(4,1fr);  
      gap:14px;  
    }  
  
    .collection{  
      min-height:250px;  
      border:1px solid var(--line);  
      border-radius:20px;  
      overflow:hidden;  
      position:relative;  
      background:#111;  
      cursor:pointer;  
    }  
  
    .collection::before{  
      content:"";  
      position:absolute;  
      inset:0;  
      background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.05));  
      z-index:1;  
    }  
  
    .collection img{  
      width:100%;  
      height:100%;  
      min-height:250px;  
      object-fit:cover;  
      transition:.5s;  
    }  
  
    .collection:hover img{  
      transform:scale(1.06);  
    }  
  
    .collection-info{  
      position:absolute;  
      right:20px;  
      bottom:18px;  
      z-index:2;  
    }  
  
    .collection-info h3{  
      font-family:"Playfair Display",serif;  
      font-size:22px;  
      margin-bottom:3px;  
    }  
  
    .collection-info span{  
      color:#bbb;  
      font-size:10px;  
    }  
  
    /* =========================  
       SHOP TOOLBAR  
    ========================== */  
  
    .shop-toolbar{  
      display:flex;  
      gap:10px;  
      flex-wrap:wrap;  
      align-items:center;  
      justify-content:space-between;  
      margin-bottom:25px;  
    }  
  
    .filters{  
      display:flex;  
      gap:8px;  
      flex-wrap:wrap;  
    }  
  
    .filter-btn{  
      height:42px;  
      padding:0 16px;  
      border:1px solid var(--line);  
      background:#101010;  
      color:#bbb;  
      border-radius:12px;  
      font-size:11px;  
      transition:.2s;  
    }  
  
    .filter-btn:hover,  
    .filter-btn.active{  
      background:var(--gold);  
      border-color:var(--gold);  
      color:#000;  
    }  
  
    .search-box{  
      width:280px;  
      position:relative;  
    }  
  
    .search-box input{  
      width:100%;  
      height:44px;  
      background:#101010;  
      border:1px solid var(--line);  
      color:#fff;  
      border-radius:12px;  
      outline:none;  
      padding:0 45px 0 15px;  
      font-size:11px;  
    }  
  
    .search-box input:focus{  
      border-color:var(--gold);  
    }  
  
    .search-icon{  
      position:absolute;  
      right:15px;  
      top:50%;  
      transform:translateY(-50%);  
      color:#888;  
    }  
  
    /* =========================  
       PRODUCTS  
    ========================== */  
  
    .products-grid{  
      display:grid;  
      grid-template-columns:repeat(4,1fr);  
      gap:18px;  
    }  
  
    .product-card{  
      background:linear-gradient(145deg,#131313,#0d0d0d);  
      border:1px solid var(--line);  
      border-radius:20px;  
      overflow:hidden;  
      position:relative;  
      transition:.3s;  
      min-width:0;  
    }  
  
    .product-card:hover{  
      transform:translateY(-5px);  
      border-color:rgba(200,169,107,.35);  
      box-shadow:0 20px 50px rgba(0,0,0,.3);

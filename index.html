<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H7 NEO | المتجر الفاخر</title>
  <!-- خط تجوال من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #0A0A0A;
      --dark-card: #141414;
      --gold: #C7A66A;
      --gold-hover: #E0BC7B;
      --cream: #F5EBE0;
      --text: #EDEDED;
      --text-muted: #A0A0A0;
      --border: rgba(199, 166, 106, 0.2);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--black);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 5000;
      padding: 15px 20px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 2px;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--cream);
      padding: 8px 15px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .icon-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .badge {
      background: var(--gold);
      color: var(--black);
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 0.75rem;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Mobile Panel */
    .mobile-panel {
      position: fixed;
      top: 80px;
      right: 15px;
      left: 15px;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      z-index: 6000;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .mobile-panel input {
      width: 100%;
      padding: 10px 15px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 20px;
      background: radial-gradient(circle at center, #1f1a10 0%, var(--black) 70%);
      border-bottom: 1px solid var(--border);
    }

    .hero h1 {
      font-size: 2.5rem;
      color: var(--cream);
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Filter & Search */
    .controls-section {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .search-input {
      background: var(--dark-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 25px;
      width: 280px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--gold);
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .cat-btn {
      background: var(--dark-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--gold);
      color: var(--black);
      font-weight: bold;
    }

    /* Products Grid */
    .products-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: var(--dark-card);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(199, 166, 106, 0.15);
    }

    .product-img-wrap {
      position: relative;
      width: 100%;
      height: 280px;
      background: #1a1a1a;
      cursor: pointer;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--cream);
    }

    .product-price {
      font-size: 1.2rem;
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 10px;
    }

    .btn-add {
      flex: 1;
      background: var(--gold);
      color: var(--black);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-add:hover {
      background: var(--gold-hover);
    }

    .btn-fav {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--cream);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-fav.active {
      color: #e74c3c;
      border-color: #e74c3c;
    }

    /* Modal Styling */
    .modal {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 7000;
      padding: 20px;
    }

    .modal-content {
      background: var(--dark-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .gallery-main img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .gallery-thumbs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .gallery-thumbs button {
      border: 1px solid var(--border);
      background: none;
      padding: 0;
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
      width: 60px;
      height: 60px;
    }

    .gallery-thumbs img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Form & Cart */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--cream);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
      .desktop-search { display: none; }
      .hero h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">H7 NEO</a>
      
      <input type="text" class="search-input desktop-search" placeholder="ابحث عن منتج..." oninput="handleSearch(this.value)">

      <div class="nav-actions">
        <button class="icon-btn" onclick="openWishlist()">
          ❤️ <span class="badge" id="wishlistCount">0</span>
        </button>
        <button class="icon-btn" onclick="openCart()">
          🛒 <span class="badge" id="cartCount">0</span>
        </button>
        <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobilePanel()">☰</button>
      </div>
    </div>
  </header>

  <!-- Mobile Panel -->
  <div class="mobile-panel" id="mobilePanel">
    <input type="text" placeholder="ابحث عن منتج..." oninput="handleSearch(this.value)">
    <p style="text-align: center; color: var(--text-muted);">تشكيلة H7 NEO الحصرية 2026</p>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <h1>الفخامة والأناقة في مكان واحد</h1>
    <p>اكتشف مجموعتنا المختارة بعناية من أحدث المنتجات الراقية</p>
  </section>

  <!-- Controls -->
  <div class="controls-section">
    <div class="categories" id="categoriesContainer">
      <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
      <button class="cat-btn" onclick="filterCategory('suns', this)">ساعات</button>
      <button class="cat-btn" onclick="filterCategory('perfumes', this)">عطور</button>
      <button class="cat-btn" onclick="filterCategory('acc', this)">إكسسوارات</button>
    </div>
  </div>

  <!-- Product Grid -->
  <main class="products-grid" id="productsGrid"></main>

  <!-- Product Detail Modal -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeProductModal()">✕</button>
      <div class="gallery-main">
        <img id="modalMainImg" src="" alt="صورة المنتج">
      </div>
      <div class="gallery-thumbs" id="modalThumbs"></div>
      <h2 id="modalTitle" style="color: var(--cream); margin-bottom: 10px;"></h2>
      <p id="modalPrice" style="color: var(--gold); font-weight: bold; font-size: 1.3rem; margin-bottom: 15px;"></p>
      <p id="modalDesc" style="color: var(--text-muted); margin-bottom: 20px;"></p>
      <button class="btn-add" style="width: 100%;" onclick="addCurrentToCart()">إضافة إلى السلة</button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeCart()">✕</button>
      <h2 style="color: var(--cream); margin-bottom: 20px;">سلة التسوق</h2>
      <div id="cartItemsList"></div>
      <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
        <p style="display: flex; justify-content: space-between; font-weight: bold;">
          <span>المجموع:</span>
          <span id="cartTotal" style="color: var(--gold);">0 د.م.</span>
        </p>
        <button class="btn-add" style="width: 100%; margin-top: 15px;" onclick="openCheckout()">إتمام الطلب عبر WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeCheckout()">✕</button>
      <h2 style="color: var(--cream); margin-bottom: 20px;">معلومات التوصيل</h2>
      <form id="whatsappForm" onsubmit="sendWhatsAppOrder(event)">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="custName" required placeholder="مثال: محمد العلوي">
        </div>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="tel" id="custPhone" required placeholder="06XXXXXXXX">
        </div>
        <div class="form-group">
          <label>المدينة</label>
          <input type="text" id="custCity" required placeholder="الدار البيضاء">
        </div>
        <div class="form-group">
          <label>العنوان السكني</label>
          <textarea id="custAddress" required rows="2" placeholder="اسم الشارع، رقم المنزل..."></textarea>
        </div>
        <button type="submit" class="btn-add" style="width: 100%; background: #25D366; color: #fff;">إرسال الطلب عبر WhatsApp 📱</button>
      </form>
    </div>
  </div>

  <script>
    // بيانات المنتجات
    const products = [
      {
        id: 1,
        name: "ساعة H7 NEO الذهبية الملكية",
        category: "suns",
        price: 890,
        image: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500",
        images: [
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500",
          "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=500"
        ],
        desc: "ساعة يد فاخرة بمحرك أوتماتيكي ومقاومة للمياه مع حزام من الفولاذ المقاوم للصدأ."
      },
      {
        id: 2,
        name: "عطر NEO Noir الخاص",
        category: "perfumes",
        price: 650,
        image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500",
        images: [
          "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500"
        ],
        desc: "تركيبة عطرية فريدة تجمع بين العود الفاخر والفل مع ثبات يدوم طويلاً."
      },
      {
        id: 3,
        name: "سوار فاخر بطلاء الذهب",
        category: "acc",
        price: 350,
        image: "https://images.unsplash.com/photo-1611591475140-be3617638440?w=500",
        images: [
          "https://images.unsplash.com/photo-1611591475140-be3617638440?w=500"
        ],
        desc: "سوار أنيق مصمم بعناية فائقة ليعطيك لمسة فاخرة في كل المناسبات."
      }
    ];

    let cart = JSON.parse(localStorage.getItem('h7_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('h7_wishlist')) || [];
    let currentProduct = null;
    let selectedCategory = 'all';
    let searchQuery = '';

    // إعداد الصفحة
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
      updateBadges();
      
      // إغلاق المودال عند النقر خارج المحتوى
      document.getElementById("productModal").addEventListener("click", (e) => {
        if (e.target.id === "productModal") closeProductModal();
      });
      
      document.addEventListener("click", (event) => {
        const panel = document.getElementById("mobilePanel");
        const menuBtn = document.getElementById("mobileMenuBtn");
        if (panel.style.display === "block" && !panel.contains(event.target) && !menuBtn.contains(event.target)) {
          panel.style.display = "none";
        }
      });
    });

    // عرض المنتجات
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      const filtered = products.filter(p => {
        const matchesCat = selectedCategory === 'all' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">لا توجد منتجات مطابقة.</p>';
        return;
      }

      filtered.forEach(p => {
        const isFav = wishlist.includes(p.id);
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-img-wrap" onclick="openProductModal(${p.id})">
            <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x500/111/C7A66A?text=H7+NEO';">
          </div>
          <div class="product-info">
            <h3 class="product-title">${p.name}</h3>
            <div class="product-price">${p.price} د.م.</div>
            <div class="card-actions">
              <button class="btn-add" onclick="addToCart(${p.id})">إضافة للسلة</button>
              <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleWishlist(${p.id})">♥</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // تصفية المنتجات
    function filterCategory(cat, btn) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderProducts();
    }

    // تفاصيل المنتج
    function openProductModal(id) {
      currentProduct = products.find(p => p.id === id);
      if (!currentProduct) return;

      document.getElementById('modalTitle').innerText = currentProduct.name;
      document.getElementById('modalPrice').innerText = `${currentProduct.price} د.م.`;
      document.getElementById('modalDesc').innerText = currentProduct.desc;
      document.getElementById('modalMainImg').src = currentProduct.image;

      const thumbsContainer = document.getElementById('modalThumbs');
      thumbsContainer.innerHTML = '';
      currentProduct.images.forEach((img, index) => {
        const btn = document.createElement('button');
        btn.innerHTML = `<img src="${img}" alt="${currentProduct.name} - صورة ${index + 1}">`;
        btn.onclick = () => document.getElementById('modalMainImg').src = img;
        thumbsContainer.appendChild(btn);
      });

      document.getElementById('productModal').style.display = 'flex';
    }

    function closeProductModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    // السلة والمفضلة
    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty++;
      } else {
        cart.push({ id, qty: 1 });
      }
      saveCart();
    }

    function addCurrentToCart() {
      if (currentProduct) {
        addToCart(currentProduct.id);
        closeProductModal();
      }
    }

    function toggleWishlist(id) {
      const index = wishlist.indexOf(id);
      if (index > -1) {
        wishlist.splice(index, 1);
      } else {
        wishlist.push(id);
      }
      localStorage.setItem('h7_wishlist', JSON.stringify(wishlist));
      updateBadges();
      renderProducts();
    }

    function saveCart() {
      localStorage.setItem('h7_cart', JSON.stringify(cart));
      updateBadges();
    }

    function updateBadges() {
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').innerText = totalItems;
      document.getElementById('wishlistCount').innerText = wishlist.length;
    }

    function openCart() {
      const list = document.getElementById('cartItemsList');
      list.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const p = products.find(prod => prod.id === item.id);
        if (p) {
          const itemTotal = p.price * item.qty;
          total += itemTotal;
          list.innerHTML += `
            <div class="cart-item">
              <div>
                <strong>${p.name}</strong><br>
                <small>${p.price} د.م. × ${item.qty}</small>
              </div>
              <div>
                <span style="color: var(--gold); font-weight: bold; margin-left: 10px;">${itemTotal} د.م.</span>
                <button onclick="removeFromCart(${p.id})" style="background:none; border:none; color:red; cursor:pointer;">✕</button>
              </div>
            </div>
          `;
        }
      });

      document.getElementById('cartTotal').innerText = `${total} د.م.`;
      document.getElementById('cartModal').style.display = 'flex';
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      saveCart();
      openCart();
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function openCheckout() {
      if (cart.length === 0) {
        alert("السلة فارغة!");
        return;
      }
      closeCart();
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    // إرسال الطلب عبر WhatsApp
    function sendWhatsAppOrder(event) {
      event.preventDefault();

      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const city = document.getElementById('custCity').value;
      const address = document.getElementById('custAddress').value;

      let itemsText = "";
      let total = 0;

      cart.forEach(item => {
        const p = products.find(prod => prod.id === item.id);
        if (p) {
          const itemTotal = p.price * item.qty;
          total += itemTotal;
          itemsText += `- ${p.name} (الكمية: ${item.qty}) : ${itemTotal} د.م.\n`;
        }
      });

      const message = `السلام عليكم، أود إتمام الطلب التالي من متجر *H7 NEO*:\n\n` +
                      `👤 *بيانات الزبون:*\n` +
                      `- الاسم: ${name}\n` +
                      `- الهاتف: ${phone}\n` +
                      `- المدينة: ${city}\n` +
                      `- العنوان: ${address}\n\n` +
                      `🛍️ *الطلبيات:*\n${itemsText}\n` +
                      `💰 *المجموع الإجمالي:* ${total} د.م.`;

      const whatsappPhone = "212600000000"; // قم بتغيير الرقم هنا لرقمك الخاص
      const whatsappUrl = `https://wa.me/${whatsappPhone}?text=${encodeURIComponent(message)}`;

      // تفادي إغلاق الموبايل للنوافذ المنبثقة
      window.location.href = whatsappUrl;
    }

    function toggleMobilePanel() {
      const panel = document.getElementById('mobilePanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>H7 NEO | متجر الأزياء</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f7f7f7;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 30px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 7px;
      color: #ddd;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 55px 20px;
    }

    .hero h2 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 15px;
    }

    .section-title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .product-image {
      height: 230px;
      background: #e9e9e9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 18px;
    }

    .product-content {
      padding: 20px;
    }

    .product h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .category {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

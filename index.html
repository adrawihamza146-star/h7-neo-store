<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H7 NEO | المتجر الرسمي</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- html2canvas & jsPDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* =========================================================
       CSS VARIABLES & RESET
    ========================================================= */
    :root {
      --bg-main: #070707;
      --bg-card: #0d0d0d;
      --bg-elevated: #141414;
      --accent: #c8a96b;
      --accent-light: #e5c98e;
      --text-main: #f8f5ef;
      --text-muted: #9c9c9c;
      --border: rgba(200, 169, 107, 0.2);
      --border-light: rgba(255, 255, 255, 0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Cairo', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: none;
      background: none;
      font-family: inherit;
      cursor: pointer;
      color: inherit;
    }

    /* =========================================================
       COMPONENTS & LAYOUT
    ========================================================= */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(7, 7, 7, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-light);
      z-index: 1000;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .brand-logo {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-light);
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      font-weight: 600;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-icons {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .icon-btn {
      position: relative;
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      transition: var(--transition);
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero Section */
    .hero {
      padding: 100px 0 60px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(200, 169, 107, 0.1) 0%, transparent 70%);
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      color: var(--accent-light);
      margin-bottom: 15px;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 30px;
      font-size: 18px;
    }

    /* Filters & Search */
    .shop-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .filter-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      font-weight: 600;
      transition: var(--transition);
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .search-box {
      position: relative;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px 10px 40px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      color: var(--text-main);
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      margin-bottom: 80px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      overflow: hidden;
      transition: var(--transition);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--border);
    }

    .product-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
    }

    .product-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-price {
      color: var(--accent-light);
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .btn-add {
      flex: 1;
      padding: 10px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      transition: var(--transition);
    }

    .btn-add:hover {
      background: var(--accent-light);
    }

    /* Drawers & Modals */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      z-index: 2001;
      transform: translateX(-100%);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .drawer-footer {
      padding: 20px;
      border-top: 1px solid var(--border-light);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: #000;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: var(--transition);
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero h1 { font-size: 32px; }
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 15px; color: var(--accent-light);">جاري التحميل...</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast">تمت العملية بنجاح</div>

  <!-- Overlay -->
  <div id="overlay" class="overlay"></div>

  <!-- Header -->
  <header>
    <div class="container nav-container">
      <div class="brand-logo">H7 NEO</div>
      <ul class="nav-links">
        <li><a href="#hero">الرئيسية</a></li>
        <li><a href="#shop">المتجر</a></li>
        <li><a href="#about">من نحن</a></li>
        <li><a href="#faq">الأسئلة الشائعة</a></li>
      </ul>
      <div class="nav-icons">
        <button id="menuBtn" class="icon-btn" style="display: none;"><i class="fa-solid fa-bars"></i></button>
        <button id="cartBtn" class="icon-btn">
          <i class="fa-solid fa-bag-shopping"></i>
          <span id="cartCount" class="badge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="hero reveal">
    <div class="container">
      <h1>تشكيلة الأناقة العصرية</h1>
      <p>اكتشفي أحدث صيحات الموضة والمنتجات الفاخرة المصممة خصيصاً لتناسب ذوقك الرفيع.</p>
    </div>
  </section>

  <!-- Shop Section -->
  <section id="shop" class="container reveal">
    <div class="shop-controls">
      <div id="filters" style="display: flex; gap: 10px;">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="hijab">حجاب</button>
        <button class="filter-btn" data-filter="accessories">إكسسوارات</button>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن منتج..." />
      </div>
    </div>

    <div id="productGrid" class="product-grid">
      <!-- Dynamic Products Inserted via JS -->
    </div>
  </section>

  <!-- Cart Drawer -->
  <div id="cartDrawer" class="drawer">
    <div class="drawer-header">
      <h3>سلة التسوق</h3>
      <button id="cartClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="cartItems" class="drawer-body">
      <!-- Cart Items Dynamic -->
    </div>
    <div class="drawer-footer">
      <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
        <span>المجموع:</span>
        <span id="cartTotal" style="color: var(--accent-light); font-weight: bold;">0.00 د.م.</span>
      </div>
      <button id="checkoutBtn" class="btn-add" style="width: 100%;">إتمام الطلب</button>
    </div>
  </div>

  <!-- Checkout Modal / Drawer -->
  <div id="checkoutModal" class="drawer" style="right: 0; left: auto; transform: translateX(100%);">
    <div class="drawer-header">
      <h3>معلومات الشحن</h3>
      <button id="checkoutClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body">
      <form id="checkoutForm" style="display: flex; flex-direction: column; gap: 15px;">
        <div>
          <label>الاسم الكامل</label>
          <input type="text" id="customerName" required style="width: 100%; padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border-light); color: #fff; border-radius: 6px;" />
        </div>
        <div>
          <label>رقم الهاتف</label>
          <input type="tel" id="customerPhone" required style="width: 100%; padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border-light); color: #fff; border-radius: 6px;" />
        </div>
        <div>
          <label>المدينة</label>
          <input type="text" id="customerCity" required style="width: 100%; padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border-light); color: #fff; border-radius: 6px;" />
        </div>
        <div>
          <label>العنوان</label>
          <input type="text" id="customerAddress" style="width: 100%; padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border-light); color: #fff; border-radius: 6px;" />
        </div>
        <div>
          <label>ملاحظات إضافية</label>
          <textarea id="customerNote" rows="3" style="width: 100%; padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border-light); color: #fff; border-radius: 6px;"></textarea>
        </div>
        <button type="submit" id="submitOrderBtn" class="btn-add" style="margin-top: 10px;">تأكيد الطلب واستلام الوصل</button>
      </form>
    </div>
  </div>

  <!-- JavaScript App Code -->
  <script>
  /* =========================================================
     GLOBAL CONFIG & DATA
  ========================================================= */
  const WHATSAPP_NUMBER = "212600000000"; // قم بتعديله لرقم الهاتف الخاص بك

  const PRODUCTS = [
    {
      id: "hajar",
      name: "حجاب هجار",
      category: "hijab",
      price: 150,
      image: "https://via.placeholder.com/400x500?text=Hijab+Hajar",
      description: "حجاب فاخر بلمسة عصرية وملمس ناعم يوفر لك الراحة طوال اليوم."
    },
    {
      id: "nadeem",
      name: "حجاب نديم",
      category: "hijab",
      price: 170,
      image: "https://via.placeholder.com/400x500?text=Hijab+Nadeem",
      description: "تصميم أنيق مميز يضفي لمسة من الفخامة على إطلالتك."
    },
    {
      id: "bonnet",
      name: "حجاب بالبوني",
      category: "hijab",
      price: 190,
      image: "https://via.placeholder.com/400x500?text=Hijab+Bonnet",
      description: "حجاب عملي متكامل مع بوني لثبات يدوم طويلاً وسهولة في ارتداءه."
    }
  ];

  let cart = JSON.parse(localStorage.getItem("h7_cart")) || [];
  let wishlist = JSON.parse(localStorage.getItem("h7_wishlist")) || [];
  let currentCategory = "all";
  let currentSearch = "";
  let currentProduct = null;

  /* =========================================================
     HELPERS & UTILS
  ========================================================= */
  const $ = (selector) => document.querySelector(selector);
  const $$ = (selector) => document.querySelectorAll(selector);

  function escapeHTML(str) {
    return String(str || '').replace(/[&<>"']/g, match => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[match]));
  }

  function money(val) {
    return `${Number(val).toFixed(2)} د.م.`;
  }

  function toast(message) {
    const el = $("#toast");
    if (!el) return;
    el.textContent = message;
    el.classList.add("show");
    setTimeout(() => {
      el.classList.remove("show");
    }, 3000);
  }

  function normalizePhone(phone) {
    return phone.replace(/\s+/g, '').replace(/[^0-9+]/g, '');
  }

  function generateOrderNumber() {
    return 'ORD-' + Math.floor(100000 + Math.random() * 900000);
  }

  function saveStorage() {
    localStorage.setItem("h7_cart", JSON.stringify(cart));
    localStorage.setItem("h7_wishlist", JSON.stringify(wishlist));
  }

  function getProduct(id) {
    return PRODUCTS.find(p => p.id === id);
  }

  /* =========================================================
     CART & WISHLIST LOGIC
  ========================================================= */
  function addToCart(id) {
    const existing = cart.find(item => item.id === id);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ id, qty: 1 });
    }
    saveStorage();
    updateCartUI();
    toast("تمت إضافة المنتج إلى السلة");
  }

  function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    saveStorage();
    updateCartUI();
  }

  function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      removeFromCart(id);
    } else {
      saveStorage();
      updateCartUI();
    }
  }

  function cartTotal() {
    return cart.reduce((sum, item) => {
      const p = getProduct(item.id);
      return sum + (p ? p.price * item.qty : 0);
    }, 0);
  }

  function toggleWishlist(id) {
    if (wishlist.includes(id)) {
      wishlist = wishlist.filter(i => i !== id);
      toast("تم حذف المنتج من المفضلة");
    } else {
      wishlist.push(id);
      toast("تمت إضافة المنتج إلى المفضلة");
    }
    saveStorage();
    updateWishlistCount();
    renderProducts();
  }

  function updateWishlistCount() {
    const el = $("#wishlistCount");
    if (el) el.textContent = wishlist.length;
  }

  /* =========================================================
     UI RENDERERS
  ========================================================= */
  function renderProducts() {
    const grid = $("#productGrid");
    if (!grid) return;

    const filtered = PRODUCTS.filter(p => {
      const matchesCat = currentCategory === "all" || p.category === currentCategory;
      const matchesSearch = p.name.toLowerCase().includes(currentSearch.toLowerCase());
      return matchesCat && matchesSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد منتجات مطابقة لجميع الفلاتر المختارة.</p>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const isWished = wishlist.includes(p.id);
      return `
        <div class="product-card" data-product="${p.id}">
          <img src="${p.image}" alt="${escapeHTML(p.name)}" class="product-img" />
          <div class="product-info">
            <h3 class="product-title">${escapeHTML(p.name)}</h3>
            <div class="product-price">${money(p.price)}</div>
            <div class="card-actions">
              <button class="btn-add" data-add="${p.id}">إضافة للسلة</button>
              <button class="icon-btn" data-wish="${p.id}" style="color: ${isWished ? 'red' : 'inherit'}">
                <i class="fa-${isWished ? 'solid' : 'regular'} fa-heart"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function updateCartUI() {
    const cartCount = $("#cartCount");
    if (cartCount) {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      cartCount.textContent = totalQty;
    }

    const container = $("#cartItems");
    if (!container) return;

    if (cart.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 40px 0;">السلة فارغة حالياً.</p>`;
    } else {
      container.innerHTML = cart.map(item => {
        const p = getProduct(item.id);
        if (!p) return "";
        return `
          <div style="display: flex; gap: 15px; margin-bottom: 15px; background: var(--bg-elevated); padding: 10px; border-radius: 8px;">
            <img src="${p.image}" alt="${escapeHTML(p.name)}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px;" />
            <div style="flex: 1;">
              <h4 style="font-size: 14px;">${escapeHTML(p.name)}</h4>
              <p style="color: var(--accent-light); font-size: 13px;">${money(p.price)}</p>
              <div style="display: flex; items-center; gap: 8px; margin-top: 5px;">
                <button data-qty="${p.id}" data-change="-1" style="padding: 2px 8px; background: var(--bg-card); border-radius: 4px;">-</button>
                <span>${item.qty}</span>
                <button data-qty="${p.id}" data-change="1" style="padding: 2px 8px; background: var(--bg-card); border-radius: 4px;">+</button>
              </div>
            </div>
            <button data-remove="${p.id}" style="color: var(--text-muted); font-size: 16px;"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      }).join("");
    }

    const totalEl = $("#cartTotal");
    if (totalEl) {
      totalEl.textContent = money(cartTotal());
    }
  }

  /* =========================================================
     MODALS & DRAWERS CONTROL
  ========================================================= */
  function openCart() {
    $("#cartDrawer")?.classList.add("open");
    $("#overlay")?.classList.add("show");
    document.body.classList.add("no-scroll");
  }

  function closeCart() {
    $("#cartDrawer")?.classList.remove("open");
    $("#overlay")?.classList.remove("show");
    document.body.classList.remove("no-scroll");
  }

  function openCheckout() {
    if (cart.length === 0) {
      toast("السلة فارغة!");
      return;
    }
    $("#checkoutModal")?.classList.add("open");
  }

  function closeCheckout() {
    $("#checkoutModal")?.classList.remove("open");
  }

  function openProduct(id) {
    currentProduct = getProduct(id);
    if (!currentProduct) return;
    toast(`عرض تفاصيل: ${currentProduct.name}`);
  }

  function closeProduct() {
    currentProduct = null;
  }

  function setModalImage(index) {
    // Gallery Handler
  }

  /* =========================================================
     MESSAGING & PDF GENERATION
  ========================================================= */
  function buildWhatsAppMessage(order, customer) {
    let msg = `*طلب جديد من المتجر (${order})*\n\n`;
    msg += `*الاسم:* ${customer.name}\n`;
    msg += `*الهاتف:* ${customer.phone}\n`;
    msg += `*المدينة:* ${customer.city}\n`;
    if (customer.address) msg += `*العنوان:* ${customer.address}\n`;
    if (customer.note) msg += `*ملاحظات:* ${customer.note}\n\n`;
    msg += `*المنتجات:*\n`;

    cart.forEach(item => {
      const p = getProduct(item.id);
      if (p) {
        msg += `- ${p.name} (الكمية: ${item.qty}) : ${p.price * item.qty} د.م.\n`;
      }
    });

    msg += `\n*المجموع الكلي:* ${cartTotal()} د.م.`;
    return msg;
  }

  async function createOrderPDF(order, customer) {
    if (!window.jspdf || !window.html2canvas) {
      console.error("PDF generation libraries are missing.");
      return false;
    }

    const { jsPDF } = window.jspdf;

    const wrapper = document.createElement("div");
    wrapper.style.position = "fixed";
    wrapper.style.left = "-9999px";
    wrapper.style.top = "-9999px";
    wrapper.style.width = "750px";
    wrapper.style.padding = "40px";
    wrapper.style.background = "#070707";
    wrapper.style.color = "#f8f5ef";
    wrapper.style.fontFamily = "'Cairo', sans-serif";

    const itemsRows = cart.map(item => {
      const product = getProduct(item.id);
      if(!product) return "";
      const subtotal = product.price * item.qty;
      return `
        <tr style="border-bottom:1px solid rgba(255,255,255,0.08);">
          <td style="padding:12px 8px;text-align:right;">${escapeHTML(product.name)}</td>
          <td style="padding:12px 8px;text-align:center;">${item.qty}</td>
          <td style="padding:12px 8px;text-align:center;">${money(product.price)}</td>
          <td style="padding:12px 8px;text-align:left;color:#e5c98e;">${money(subtotal)}</td>
        </tr>
      `;
    }).join("");

    wrapper.innerHTML = `
      <div style="border:1px solid rgba(200,169,107,0.3);padding:30px;border-radius:16px;background:#0d0d0d;">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:20px;margin-bottom:20px;">
          <div>
            <h1 style="font-family:'Playfair Display',serif;color:#e5c98e;margin:0;font-size:28px;">H7 NEO</h1>
            <p style="color:#c8a96b;margin:5px 0 0;font-size:10px;letter-spacing:2px;">LUXE & ÉLÉGANCE</p>
          </div>
          <div style="text-align:left;">
            <h3 style="margin:0;font-size:16px;color:#fff;">REÇU DE COMMANDE</h3>
            <p style="margin:5px 0 0;color:#9c9c9c;font-size:11px;">${escapeHTML(order)}</p>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px;font-size:12px;">
          <div>
            <strong style="color:#c8a96b;display:block;margin-bottom:6px;">معلومات الزبون:</strong>
            <p style="margin:3px 0;"><strong>الاسم:</strong> ${escapeHTML(customer.name)}</p>
            <p style="margin:3px 0;"><strong>الهاتف:</strong> ${escapeHTML(customer.phone)}</p>
            <p style="margin:3px 0;"><strong>المدينة:</strong> ${escapeHTML(customer.city)}</p>
            ${customer.address ? `<p style="margin:3px 0;"><strong>العنوان:</strong> ${escapeHTML(customer.address)}</p>` : ''}
          </div>
          <div style="text-align:left;">
            <strong style="color:#c8a96b;display:block;margin-bottom:6px;">تفاصيل الطلب:</strong>
            <p style="margin:3px 0;"><strong>التاريخ:</strong> ${new Date().toLocaleDateString('fr-FR')}</p>
            <p style="margin:3px 0;"><strong>طريقة الدفع:</strong> الدفع عند الاستلام</p>
            <p style="margin:3px 0;"><strong>التوصيل:</strong> داخل المغرب</p>
          </div>
        </div>

        <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:25px;">
          <thead>
            <tr style="border-bottom:1px solid #c8a96b;color:#c8a96b;">
              <th style="padding:8px;text-align:right;">المنتج</th>
              <th style="padding:8px;text-align:center;">الكمية</th>
              <th style="padding:8px;text-align:center;">الثمن</th>
              <th style="padding:8px;text-align:left;">المجموع</th>
            </tr>
          </thead>
          <tbody>
            ${itemsRows}
          </tbody>
        </table>

        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,0.1);padding-top:15px;">
          <span style="font-size:11px;color:#9c9c9c;">شكراً لثقتكم بـ H7 NEO</span>
          <div style="font-size:18px;font-weight:bold;color:#e5c98e;">
            المجموع الكلي: ${money(cartTotal())}
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(wrapper);

    try {
      const canvas = await html2canvas(wrapper, {
        scale: 2,
        backgroundColor: "#070707",
        useCORS: true
      });

      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      const pdf = new jsPDF("p", "mm", "a4");
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

      pdf.addImage(imgData, "JPEG", 0, 0, pdfWidth, pdfHeight);
      pdf.save(`Commande_${order}.pdf`);
      document.body.removeChild(wrapper);
      return true;
    } catch (error) {
      console.error("PDF generation failed:", error);
      if (document.body.contains(wrapper)) {
        document.body.removeChild(wrapper);
      }
      return false;
    }
  }

  /* =========================================================
     SUBMIT ORDER
  ========================================================= */
  async function handleOrderSubmit(e) {
    e.preventDefault();

    const submitBtn = $("#submitOrderBtn");
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.6";

    const customer = {
      name: $("#customerName").value.trim(),
      phone: normalizePhone($("#customerPhone").value),
      city: $("#customerCity").value.trim(),
      address: $("#customerAddress").value.trim(),
      note: $("#customerNote").value.trim()
    };

    const orderNumber = generateOrderNumber();
    toast("جاري إعداد وصل الطلب...");

    await createOrderPDF(orderNumber, customer);

    const text = buildWhatsAppMessage(orderNumber, customer);
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;

    cart = [];
    saveStorage();
    updateCartUI();

    closeCheckout();
    closeCart();

    $("#checkoutForm").reset();

    submitBtn.disabled = false;
    submitBtn.style.opacity = "1";

    window.open(url, "_blank");
  }

  /* =========================================================
     EVENT LISTENERS
  ========================================================= */
  document.addEventListener("DOMContentLoaded", () => {

    const loader = $("#loader");
    if (loader) {
      setTimeout(() => {
        loader.classList.add("hide");
      }, 600);
    }

    renderProducts();
    updateCartUI();
    updateWishlistCount();

    // Mobile Menu
    $("#menuBtn")?.addEventListener("click", () => {
      $("#mobileMenu")?.classList.add("open");
      $("#overlay")?.classList.add("show");
      document.body.classList.add("no-scroll");
    });

    const closeMobile = () => {
      $("#mobileMenu")?.classList.remove("open");
      if (!$("#cartDrawer")?.classList.contains("open")) {
        $("#overlay")?.classList.remove("show");
        document.body.classList.remove("no-scroll");
      }
    };

    $("#mobileClose")?.addEventListener("click", closeMobile);

    // Drawers & Modals
    $("#cartBtn")?.addEventListener("click", openCart);
    $("#cartClose")?.addEventListener("click", closeCart);
    $("#checkoutBtn")?.addEventListener("click", openCheckout);
    $("#checkoutClose")?.addEventListener("click", closeCheckout);
    $("#productClose")?.addEventListener("click", closeProduct);

    $("#overlay")?.addEventListener("click", () => {
      closeMobile();
      closeCart();
    });

    // Filters & Search
    $("#filters")?.addEventListener("click", (e) => {       const btn = e.target.closest(".filter-btn");       if (!btn) return;        $$(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      currentCategory = btn.dataset.filter;
      renderProducts();
    });

    $("#searchInput")?.addEventListener("input", (e) => {
      currentSearch = e.target.value;
      renderProducts();
    });

    // Delegated Clicks (Products / Cart / Wishlist)
    document.addEventListener("click", (e) => {

      // Add to cart
      const addBtn = e.target.closest("[data-add]");
      if (addBtn) {
        e.stopPropagation();
        addToCart(addBtn.dataset.add);
        return;
      }

      // Wishlist toggle
      const wishBtn = e.target.closest("[data-wish]");
      if (wishBtn) {
        e.stopPropagation();
        toggleWishlist(wishBtn.dataset.wish);
        return;
      }

      // Open product modal
      const prodCard = e.target.closest("[data-product]");
      if (prodCard) {
        openProduct(prodCard.dataset.product);
        return;
      }

      // Cart quantity change
      const qtyBtn = e.target.closest("[data-qty]");
      if (qtyBtn) {
        changeQty(qtyBtn.dataset.qty, Number(qtyBtn.dataset.change));
        return;
      }

      // Remove from cart
      const removeBtn = e.target.closest("[data-remove]");
      if (removeBtn) {
        removeFromCart(removeBtn.dataset.remove);
        return;
      }

    });

    // Checkout form submit
    $("#checkoutForm")?.addEventListener("submit", handleOrderSubmit);      // Intersection Observer for Animations     const reveals = $$(".reveal");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    }, { threshold: 0.1 });

    reveals.forEach(el => observer.observe(el));

  });
  </script>
</body>
